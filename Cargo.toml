[package]
name = "fridica-core"
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
description = "Fridica's domain: threads, parent decisions and delegation, workers, machines and placement, delivery outcomes and attention policy"
license = "MIT"
repository = "https://github.com/chengcli/fridica-core"
readme = "README.md"
keywords = ["agent", "slack", "orchestration"]
categories = ["data-structures", "development-tools"]

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-casefold = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
# Only for the `conformance` feature: it runs each check on a runtime of its own.
tokio = { version = "1", features = ["rt"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"], optional = true }

[features]
native-secrets = ["dep:security-framework", "dep:secret-service"]
# `store::conformance`: the storage contract's checks, for backends' tests.
conformance = ["dep:tokio"]

[lints.rust]
unsafe_code = "forbid"
